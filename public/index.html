<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14243a"><title>QenSpace | Shop Management System</title>
<style>
:root{--navy:#14243a;--blue:#2859c5;--teal:#0c8f7e;--bg:#f3f6fb;--line:#e1e8f1;--text:#172235;--muted:#65748b;--white:#fff;--red:#b42318}*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;font-weight:700;background:var(--blue);color:white}button.secondary{background:#eaf0ff;color:#214ba8}button.ghost{background:white;color:#30425d;border:1px solid var(--line)}button.danger{background:#fff0ef;color:var(--red)}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{width:100%;border:1px solid #d6dfeb;border-radius:9px;padding:10px 11px;background:white;color:var(--text)}label{display:block;font-size:12px;font-weight:750;color:#536279;margin:0 0 6px}.field{min-width:0}.field input,.field select,.field textarea{margin-bottom:12px}.hidden{display:none!important}.top{background:var(--navy);color:white;padding:15px 22px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#5ce0c9,#86a8ff);color:#132238;font-weight:900}.brand h1{font-size:16px;margin:0}.brand p{font-size:11px;margin:3px 0 0;color:#c1ccdb}.userbox{display:flex;align-items:center;gap:10px;font-size:12px}.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 72px)}aside{background:white;border-right:1px solid var(--line);padding:15px 10px}nav button{display:block;width:100%;text-align:left;margin:3px 0;background:transparent;color:#4a5a72;font-weight:650}nav button.active{background:#eaf0ff;color:#214ba8}main{padding:24px;max-width:1500px;width:100%;margin:auto}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}.heading h2{margin:0;font-size:25px}.heading p{margin:5px 0 0;color:var(--muted);font-size:13px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:0 4px 16px #16243a08;min-width:0}.statlabel{color:var(--muted);font-size:12px;font-weight:650}.statvalue{font-size:25px;font-weight:850;margin:7px 0 3px}.muted{color:var(--muted)}.small{font-size:11px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:white}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #edf0f5;font-size:12px;vertical-align:top}th{background:#f8fafc;color:#66758a;text-transform:uppercase;font-size:10px;letter-spacing:.6px}tr:last-child td{border-bottom:0}.pill{display:inline-block;border-radius:30px;background:#edf2f7;color:#475569;padding:4px 8px;font-size:10px;font-weight:800}.pill.green{background:#e8f7ef;color:#067647}.pill.amber{background:#fff5d9;color:#8b6100}.pill.red{background:#fff0ef;color:#b42318}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.toolbar input{max-width:280px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}.alert{padding:12px;border-radius:10px;background:#fff5d9;color:#795400;margin-bottom:14px;font-size:12px}.toast{position:fixed;bottom:18px;right:18px;background:#14243a;color:white;border-radius:10px;padding:12px 16px;box-shadow:0 8px 30px #0002;z-index:100;max-width:360px}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#dbe8ff,transparent 40%),var(--bg)}.login{width:min(430px,100%);background:white;border:1px solid var(--line);border-radius:20px;padding:27px;box-shadow:0 15px 50px #1b31531a}.login h2{margin:17px 0 5px;font-size:23px}.login p{color:var(--muted);font-size:13px}.login button{width:100%;margin-top:7px}.login .brand{color:var(--text)}.login .brand p{color:var(--muted)}.notice{font-size:11px;color:var(--muted);line-height:1.6;margin-top:14px}.empty{text-align:center;padding:28px;color:var(--muted)}.receipt{max-width:520px;margin:auto;background:white;padding:22px}.receipt h2{text-align:center}.receipt .center{text-align:center}.right{text-align:right}.footer{text-align:center;color:#8a97a9;font-size:11px;padding:15px}@media(max-width:950px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{grid-template-columns:180px 1fr}main{padding:17px}}@media(max-width:700px){.top{padding:12px}.userbox span{display:none}.shell{display:block}aside{position:sticky;top:0;z-index:10;padding:6px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}nav{display:flex;min-width:max-content;gap:3px}nav button{width:auto;margin:0;padding:9px;font-size:12px}main{padding:13px 10px}.heading h2{font-size:22px}.stats{gap:8px}.card{padding:13px}.statvalue{font-size:21px}.two{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.brand h1{font-size:13px}.brand p{font-size:10px}}@media print{.top,aside,.no-print,.heading{display:none!important}.shell{display:block}main{padding:0}.card{box-shadow:none}}
</style></head><body><div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);let me=null,shopName='QenSpace Solutions and Mobile Repairs',page='dashboard',products=[],cart=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const kes=n=>'KSh '+Number(n||0).toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2});
async function api(url,opts={}){const r=await fetch('/api'+url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3500)}
function field(label,name,type='text',value='',required=false,extra=''){return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${extra}></div>`}
function selectField(label,name,options){return `<div class="field"><label for="${name}">${label}</label><select id="${name}" name="${name}">${options.map(x=>`<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('')}</select></div>`}
function pageHead(title,sub,action=''){return `<div class="heading"><div><h2>${title}</h2><p>${sub}</p></div>${action}</div>`}
function stat(label,value,foot=''){return `<div class="card"><div class="statlabel">${label}</div><div class="statvalue">${value}</div><div class="small muted">${foot}</div></div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">No records yet.</td></tr>`}</tbody></table></div>`}
function renderLogin(){ $('#app').innerHTML=`<div class="loginwrap"><form class="login" id="loginForm"><div class="brand"><div class="logo">QS</div><div><h1>${esc(shopName)}</h1><p>Shop Management System</p></div></div><h2>Welcome back</h2><p>Sign in to your secure shop portal.</p><div class="field"><label>Username</label><input name="username" autocomplete="username" required autofocus></div><div class="field"><label>Password</label><input type="password" name="password" autocomplete="current-password" required></div><button>Sign in</button><div class="notice">Authorized staff only. Do not share your password. Contact the administrator if your account is locked or inactive.</div></form></div>`;$('#loginForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{const d=await api('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(fd))});me=d.user;await renderApp()}catch(err){toast(err.message)}}}
async function init(){try{const d=await api('/me');me=d.user;shopName=d.shopName||shopName;if(me)await renderApp();else renderLogin()}catch(e){renderLogin()}}
async function renderApp(){const isAdmin=me.role==='admin';$('#app').innerHTML=`<header class="top"><div class="brand"><div class="logo">QS</div><div><h1>${esc(shopName)}</h1><p>Online Shop Management System</p></div></div><div class="userbox"><span>${esc(me.displayName)} · ${isAdmin?'Administrator':'Shop Attendant'}</span><button class="ghost" id="logout">Sign out</button></div></header><div class="shell"><aside><nav id="nav">${[['dashboard','▦ Dashboard'],['sales','▣ Sales / Receipts'],['inventory','▤ Inventory'],['repairs','⚒ Repairs'],['mpesa','◉ M-Pesa Agent'],...(isAdmin?[['expenses','▧ Expenses'],['reports','▥ Reports'],['staff','♙ Staff Accounts'],['settings','⚙ Settings & Audit']]:[])].map(([k,v])=>`<button data-page="${k}" class="${page===k?'active':''}">${v}</button>`).join('')}</nav></aside><main id="main"></main></div><div class="footer">${esc(shopName)} · KES · Manual M-Pesa recording · Secure server sign-in</div>`;
$('#logout').onclick=async()=>{try{await api('/logout',{method:'POST'})}catch{}me=null;cart=[];renderLogin()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;cart=[];renderApp()});await renderPage()}
async function renderPage(){const main=$('#main');main.innerHTML='<div class="card">Loading…</div>';try{if(page==='dashboard')await dashboard(main);else if(page==='inventory')await inventory(main);else if(page==='sales')await sales(main);else if(page==='repairs')await repairs(main);else if(page==='mpesa')await mpesa(main);else if(page==='expenses')await expenses(main);else if(page==='reports')await reports(main);else if(page==='staff')await staff(main);else if(page==='settings')await settings(main)}catch(e){main.innerHTML=`<div class="alert">${esc(e.message)}</div>`}}
async function dashboard(el){const d=await api('/dashboard');el.innerHTML=pageHead('Dashboard','Today at a glance')+`<div class="grid stats">${stat('Sales today',kes(d.salesToday),`${d.salesCount} sales`)}${stat('Low-stock products',d.lowStock,'Products at or below reorder level')}${stat('Open repair jobs',d.openRepairs,'Not yet collected or cancelled')}${stat('M-Pesa commission today',kes(d.commissionToday),'Manually recorded commission')}</div><div class="card"><h3>Recent sales</h3>${table(['Receipt','Amount','Payment','Attendant','Date'],d.recent.map(s=>`<tr><td>${esc(s.receipt_no)}</td><td>${kes(s.total)}</td><td>${esc(s.payment_method)}</td><td>${esc(s.display_name)}</td><td>${esc(s.created_at)}</td></tr>`).join(''))}</div><p class="small muted">Amounts are operational summaries. Reconcile cash and M-Pesa float with your actual statements.</p>`}
async function inventory(el){products=await api('/products');const admin=me.role==='admin';el.innerHTML=pageHead('Inventory','Branded accessories, individual prices and stock',admin?'<button id="addProduct">+ Add product</button>':'')+`<div class="toolbar"><input id="searchProduct" placeholder="Search name, SKU, brand…"><select id="catFilter"><option value="">All categories</option>${[...new Set(products.map(p=>p.category))].sort().map(c=>`<option>${esc(c)}</option>`).join('')}</select>${admin?'<button class="secondary" id="starter">Add starter catalogue</button>':''}</div><div id="productTable"></div>`;function draw(){const q=$('#searchProduct').value.toLowerCase(),cat=$('#catFilter').value;const list=products.filter(p=>(!cat||p.category===cat)&&[p.name,p.sku,p.brand,p.variant,p.category].join(' ').toLowerCase().includes(q));$('#productTable').innerHTML=table(['SKU / Product','Category','Brand / Variant','Cost','Selling price','Stock','Status',...(admin?['Actions']:[])],list.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="small muted">${esc(p.sku||'')}</div></td><td>${esc(p.category)}</td><td>${esc(p.brand||'—')}<div class="small muted">${esc(p.variant||'')}</div></td><td>${kes(p.cost)}</td><td><b>${kes(p.price)}</b></td><td>${p.quantity}</td><td>${p.quantity<=p.reorder_level?'<span class="pill red">Low stock</span>':'<span class="pill green">In stock</span>'}</td>${admin?`<td><button class="secondary" data-edit="${p.id}">Edit</button> <button class="ghost" data-stock="${p.id}">+ Stock</button></td>`:''}</tr>`).join(''));
if(admin){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>productForm(products.find(p=>p.id==b.dataset.edit)));document.querySelectorAll('[data-stock]').forEach(b=>b.onclick=()=>stockForm(b.dataset.stock));}}
$('#searchProduct').oninput=draw;$('#catFilter').onchange=draw;draw();if(admin){$('#addProduct').onclick=()=>productForm();$('#starter').onclick=async()=>{if(!confirm('Add example products and sample prices? Existing SKUs will be skipped. Review all prices and stock quantities before trading.'))return;try{const d=await api('/starter-catalogue',{method:'POST',body:'{}'});toast(d.message);products=await api('/products');draw()}catch(e){toast(e.message)}}}}
function productForm(p){const editing=!!p;const html=`<form id="productForm"><div class="formgrid">${field('Product name','name','text',p?.name||'',true)}${field('SKU (optional)','sku','text',p?.sku||'')}${selectField('Category','category',['Chargers','Earphones','Tempered Glass','Cables','Phone Covers','Power Banks','Adapters','Memory Cards','Repairs','Other'].map(x=>[x,x]))}${field('Brand','brand','text',p?.brand||'')}${field('Model / variant','variant','text',p?.variant||'')}${field('Buying cost (KSh)','cost','number',p?.cost||0,true,'min="0" step="0.01"')}${field('Selling price (KSh)','price','number',p?.price||0,true,'min="0" step="0.01"')}${field('Stock quantity','quantity','number',p?.quantity||0,true,'min="0" step="1"')}${field('Reorder level','reorderLevel','number',p?.reorder_level??5,true,'min="0" step="1"')}</div><div class="actions"><button>${editing?'Save changes':'Create product'}</button><button type="button" class="ghost" onclick="closeModal()">Cancel</button></div></form>`;modal(editing?'Edit product':'Add product',html);if(p)$('#category').value=p.category;$('#productForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{await api(editing?`/products/${p.id}`:'/products',{method:editing?'PUT':'POST',body:JSON.stringify(b)});closeModal();toast('Product saved.');await renderPage()}catch(err){toast(err.message)}}}
function stockForm(id){const html=`<form id="stockForm">${field('Quantity received','quantity','number',1,true,'min="1" step="1"')}<div class="actions"><button>Receive stock</button></div></form>`;modal('Receive stock',html);$('#stockForm').onsubmit=async e=>{e.preventDefault();try{await api(`/products/${id}/stock`,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();toast('Stock updated.');await renderPage()}catch(err){toast(err.message)}}}
async function sales(el){products=await api('/products');const history=await api('/sales');el.innerHTML=pageHead('Sales & Receipts','Create a sale, deduct stock and issue a digital receipt')+`<div class="grid two"><div class="card"><h3>New sale</h3><form id="saleForm"><div class="field"><label>Product</label><select id="saleProduct" required><option value="">Select product</option>${products.filter(p=>p.quantity>0).map(p=>`<option value="${p.id}">${esc(p.name)} — ${kes(p.price)} (${p.quantity} available)</option>`).join('')}</select></div><div class="formgrid">${field('Quantity','itemQty','number',1,true,'min="1" step="1"')}${field('Customer name (optional)','customerName') }</div><button type="button" class="secondary" id="addToCart">Add item</button><div id="cartArea" style="margin:14px 0"></div><div class="formgrid">${selectField('Payment method','paymentMethod',[['Cash','Cash'],['M-Pesa','M-Pesa'],['Card','Card'],['Split','Split'],['Credit','Credit']])}${field('Amount paid (KSh)','paidAmount','number','',false,'min="0" step="0.01"')}</div><div class="field"><label>Notes (optional)</label><input name="notes"></div><button>Create sale & receipt</button></form></div><div class="card"><h3>Recent sales</h3>${table(['Receipt','Total','Paid','Payment','Date','Action'],history.slice(0,30).map(s=>`<tr><td>${esc(s.receipt_no)}</td><td>${kes(s.total)}</td><td>${kes(s.paid)}</td><td>${esc(s.payment_method)}</td><td>${esc(s.created_at)}</td><td><button class="secondary" data-receipt="${s.id}">Receipt</button></td></tr>`).join(''))}</div></div>`;
function cartDraw(){const total=cart.reduce((a,i)=>a+i.price*i.quantity,0);$('#cartArea').innerHTML=cart.length?`<div class="tablewrap"><table style="min-width:0"><thead><tr><th>Item</th><th>Qty</th><th>Total</th><th></th></tr></thead><tbody>${cart.map((i,n)=>`<tr><td>${esc(i.name)}</td><td>${i.quantity}</td><td>${kes(i.price*i.quantity)}</td><td><button type="button" class="danger" data-remove="${n}">×</button></td></tr>`).join('')}</tbody></table></div><p><b>Total: ${kes(total)}</b></p>`:'<p class="small muted">No items added yet.</p>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(Number(b.dataset.remove),1);cartDraw()})}
$('#addToCart').onclick=()=>{const id=Number($('#saleProduct').value),qty=Number($('#itemQty').value),p=products.find(x=>x.id===id);if(!p||!Number.isInteger(qty)||qty<1)return toast('Choose a product and valid quantity.');const inCart=cart.find(x=>x.productId===id);const total=(inCart?.quantity||0)+qty;if(total>p.quantity)return toast('Quantity exceeds available stock.');if(inCart)inCart.quantity=total;else cart.push({productId:p.id,name:p.name,price:Number(p.price),quantity:qty});cartDraw()};cartDraw();$('#saleForm').onsubmit=async e=>{e.preventDefault();if(!cart.length)return toast('Add at least one product.');const fd=new FormData(e.target);const body={items:cart.map(i=>({productId:i.productId,quantity:i.quantity})),customerName:fd.get('customerName'),notes:fd.get('notes'),paymentMethod:fd.get('paymentMethod'),paidAmount:fd.get('paidAmount')||undefined};try{const d=await api('/sales',{method:'POST',body:JSON.stringify(body)});cart=[];toast('Sale saved: '+d.receiptNo);await receiptById(d.id);await renderPage()}catch(err){toast(err.message)}};document.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>receiptById(b.dataset.receipt))}
async function receiptById(id){try{const s=await api('/sales/'+id);const rows=s.items.map(i=>`<tr><td>${esc(i.product_name)}</td><td>${i.quantity}</td><td>${kes(i.unitPrice)}</td><td>${kes(i.lineTotal)}</td></tr>`).join('');modal('Digital receipt',`<div class="receipt" id="printReceipt"><div class="center"><h2>${esc(shopName)}</h2><p>Sales receipt</p></div><p><b>Receipt:</b> ${esc(s.receipt_no)}<br><b>Date:</b> ${esc(s.created_at)}<br><b>Served by:</b> ${esc(s.display_name)}<br><b>Customer:</b> ${esc(s.customer_name||'Walk-in')}</p>${table(['Item','Qty','Unit price','Total'],rows)}<h3 class="right">Total: ${kes(s.total)}</h3><p>Paid: ${kes(s.paid)}<br>Balance: ${kes(Number(s.total)-Number(s.paid))}<br>Payment: ${esc(s.payment_method)}</p><p class="center">Thank you for shopping with us.</p></div><div class="actions no-print"><button onclick="window.print()">Print / Save PDF</button></div>`)}catch(e){toast(e.message)}}
async function repairs(el){const rows=await api('/repairs');el.innerHTML=pageHead('Phone repairs','Register repair jobs, quotations, payments and status','<button id="newRepair">+ New repair job</button>')+`<div class="card">${table(['Job No.','Customer','Device','Issue','Quote','Paid','Balance','Status','Action'],rows.map(r=>`<tr><td><b>${esc(r.job_no)}</b></td><td>${esc(r.customer_name)}<div class="small muted">${esc(r.customer_phone)}</div></td><td>${esc(r.device)}</td><td>${esc(r.issue)}</td><td>${kes(r.quote)}</td><td>${kes(r.paid)}</td><td>${kes(r.balance)}</td><td><span class="pill ${r.status==='Collected'?'green':r.status==='Cancelled'?'red':'amber'}">${esc(r.status)}</span></td><td><button class="secondary" data-repair="${r.id}">Update</button></td></tr>`).join(''))}</div>`;$('#newRepair').onclick=()=>repairForm();document.querySelectorAll('[data-repair]').forEach(b=>b.onclick=()=>repairForm(rows.find(r=>r.id==b.dataset.repair)))}
function repairForm(r){const statuses=['Received','Diagnosing','Awaiting Parts','In Progress','Ready for Collection','Collected','Cancelled'];const html=`<form id="repairForm"><div class="formgrid">${field('Customer name','customerName','text',r?.customer_name||'',true)}${field('Customer phone','customerPhone','tel',r?.customer_phone||'')}${field('Device / model','device','text',r?.device||'',true)}${field('Quoted amount (KSh)','quote','number',r?.quote||0,true,'min="0" step="0.01"')}${field('Amount paid (KSh)','paid','number',r?.paid||0,true,'min="0" step="0.01"')}${selectField('Status','status',statuses.map(s=>[s,s]))}<div class="field full"><label>Reported fault</label><textarea name="issue" required>${esc(r?.issue||'')}</textarea></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(r?.notes||'')}</textarea></div></div><button>${r?'Save updates':'Create repair job'}</button></form>`;modal(r?'Update repair job':'New repair job',html);if(r)$('#status').value=r.status;$('#repairForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{if(r)await api('/repairs/'+r.id,{method:'PATCH',body:JSON.stringify(b)});else await api('/repairs',{method:'POST',body:JSON.stringify(b)});closeModal();toast('Repair record saved.');await renderPage()}catch(err){toast(err.message)}}}
async function mpesa(el){const rows=await api('/mpesa');el.innerHTML=pageHead('M-Pesa Agent','Manual transaction log only; no live Safaricom connection')+`<div class="grid two"><div class="card"><h3>Record agent transaction</h3><form id="mpesaForm"><div class="formgrid">${selectField('Transaction type','type',[['DEPOSIT','Customer deposit'],['WITHDRAWAL','Customer withdrawal'],['OTHER','Other / adjustment']])}${field('M-Pesa reference','reference','text','',true)}${field('Amount (KSh)','amount','number','',true,'min="0.01" step="0.01"')}${field('Commission (KSh)','commission','number','0',true,'min="0" step="0.01"')}${field('Customer name','customerName')}${field('Phone number','phone','tel')}</div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><button>Save transaction</button></form></div><div class="card"><h3>Recent transactions</h3>${table(['Reference','Type','Amount','Commission','Customer','Date'],rows.map(r=>`<tr><td>${esc(r.txn_ref)}</td><td>${esc(r.txn_type)}</td><td>${kes(r.amount)}</td><td>${kes(r.commission)}</td><td>${esc(r.customer_name||'—')}<div class="small muted">${esc(r.phone||'')}</div></td><td>${esc(r.created_at)}</td></tr>`).join(''))}</div></div><p class="small muted">This records transactions entered by staff. It does not send or verify payments, connect to Safaricom, or calculate an authoritative float balance.</p>`;$('#mpesaForm').onsubmit=async e=>{e.preventDefault();try{await api('/mpesa',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});toast('M-Pesa transaction saved.');await renderPage()}catch(err){toast(err.message)}}}
async function expenses(el){const rows=await api('/expenses');el.innerHTML=pageHead('Expenses','Administrator-only operating expense records')+`<div class="grid two"><div class="card"><h3>Record expense</h3><form id="expenseForm"><div class="formgrid">${selectField('Category','category',['Rent','Utilities','Transport','Supplies','Repair parts','Wages','Other'].map(x=>[x,x]))}${field('Amount (KSh)','amount','number','',true,'min="0.01" step="0.01"')}</div>${field('Description','description','text','',true)}<button>Save expense</button></form></div><div class="card"><h3>Recent expenses</h3>${table(['Category','Description','Amount','Recorded by','Date'],rows.map(r=>`<tr><td>${esc(r.category)}</td><td>${esc(r.description)}</td><td>${kes(r.amount)}</td><td>${esc(r.display_name)}</td><td>${esc(r.created_at)}</td></tr>`).join(''))}</div></div>`;$('#expenseForm').onsubmit=async e=>{e.preventDefault();try{await api('/expenses',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});toast('Expense saved.');await renderPage()}catch(err){toast(err.message)}}}
async function reports(el){const d=await api('/reports');el.innerHTML=pageHead('Reports','Summary of recorded activity')+`<div class="grid stats">${stat('Sales total',kes(d.sales.total),`${d.sales.count} sales`)}${stat('Stock cost value',kes(d.stock.value),`${d.stock.units} units across ${d.stock.products} products`)}${stat('M-Pesa transactions',d.mpesa.count,`Recorded value ${kes(d.mpesa.amount)}`)}${stat('Repair jobs',d.repairs.count,`Paid ${kes(d.repairs.paid)} of quoted ${kes(d.repairs.quoted)}`)}</div><div class="card"><h3>Notes</h3><p class="muted">These summaries reflect recorded data only. They are not audited financial statements or tax reports. Reconcile sales, expenses, repair payments and M-Pesa agent statements before using totals for accounting decisions.</p><button class="secondary" onclick="window.print()">Print report</button></div>`}
async function staff(el){const rows=await api('/users');el.innerHTML=pageHead('Staff accounts','Create and deactivate administrator or attendant logins','<button id="addStaff">+ Add user</button>')+`<div class="card">${table(['Name','Username','Role','Status','Created','Action'],rows.map(u=>`<tr><td>${esc(u.display_name)}</td><td>${esc(u.username)}</td><td>${esc(u.role)}</td><td>${u.active?'<span class="pill green">Active</span>':'<span class="pill red">Inactive</span>'}</td><td>${esc(u.created_at)}</td><td>${u.id===me.id?'<span class="small muted">Current user</span>':`<button class="${u.active?'danger':'secondary'}" data-toggle-user="${u.id}" data-active="${u.active}">${u.active?'Deactivate':'Activate'}</button> <button class="ghost" data-password-user="${u.id}">Reset password</button>`}</td></tr>`).join(''))}</div><p class="small muted">Use unique passwords of at least 12 characters. Deactivated users cannot sign in.</p>`;$('#addStaff').onclick=()=>staffForm();document.querySelectorAll('[data-toggle-user]').forEach(b=>b.onclick=async()=>{try{await api('/users/'+b.dataset.toggleUser,{method:'PATCH',body:JSON.stringify({active:b.dataset.active!=='1'})});toast('Account updated.');await renderPage()}catch(e){toast(e.message)}});document.querySelectorAll('[data-password-user]').forEach(b=>b.onclick=()=>{const password=prompt('Enter a new password (at least 12 characters):');if(password===null)return;api('/users/'+b.dataset.passwordUser,{method:'PATCH',body:JSON.stringify({password})}).then(()=>toast('Password reset.')).catch(e=>toast(e.message))})}
function staffForm(){modal('Create staff account',`<form id="staffForm"><div class="formgrid">${field('Display name','displayName','text','',true)}${field('Username','username','text','',true)}${field('Temporary password (12+ characters)','password','password','',true)}${selectField('Role','role',[['attendant','Shop Attendant'],['admin','Administrator']])}</div><button>Create account</button></form>`);$('#staffForm').onsubmit=async e=>{e.preventDefault();try{await api('/users',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();toast('Staff account created.');await renderPage()}catch(err){toast(err.message)}}}
async function settings(el){const logs=await api('/audit');el.innerHTML=pageHead('Settings & Audit','Administrator tools and recent activity')+`<div class="grid two"><div class="card"><h3>Starter product catalogue</h3><p class="muted">Adds sample Amaya, Oraimo, Samsung and generic chargers; earphones; model-specific tempered glass; cables, covers, power banks and other accessories. Existing SKUs are skipped.</p><div class="actions"><button id="starterSettings">Add starter catalogue</button><button class="secondary" id="downloadBackup">Download data backup</button></div><p class="small muted">All prices and quantities are examples. Edit them to match your suppliers and physical stock.</p></div><div class="card"><h3>Security and deployment</h3><ul><li>Use HTTPS on the hosted website.</li><li>Set a unique session secret and strong administrator password.</li><li>Keep the database on persistent storage and make backups.</li><li>Never share administrator credentials with attendants.</li><li>M-Pesa is manual and is not connected to Safaricom.</li></ul></div></div><div class="card" style="margin-top:14px"><h3>Recent audit log</h3>${table(['When','User','Action','Details'],logs.map(l=>`<tr><td>${esc(l.created_at)}</td><td>${esc(l.username||'System')}</td><td>${esc(l.action)}</td><td>${esc(l.details)}</td></tr>`).join(''))}</div>`;$('#starterSettings').onclick=async()=>{if(!confirm('Add the example product catalogue?'))return;try{const d=await api('/starter-catalogue',{method:'POST',body:'{}'});toast(d.message);await renderPage()}catch(e){toast(e.message)}};$('#downloadBackup').onclick=async()=>{try{const r=await fetch('/api/backup');if(!r.ok){const d=await r.json();throw Error(d.error||'Backup failed')}const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='qenspace-backup.json';a.click();URL.revokeObjectURL(url);toast('Backup downloaded. Store it securely.')}catch(e){toast(e.message)}}}
function modal(title,content){closeModal();const d=document.createElement('div');d.className='modalback';d.style.cssText='position:fixed;inset:0;background:#07162980;z-index:50;display:grid;place-items:center;padding:15px';d.innerHTML=`<div class="card" style="width:min(720px,100%);max-height:90vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h3>${esc(title)}</h3><button class="ghost" id="closeModal">Close ×</button></div>${content}</div>`;d.id='activeModal';document.body.append(d);$('#closeModal').onclick=closeModal}
function closeModal(){document.querySelectorAll('#activeModal').forEach(e=>e.remove())}
init();
</script></body></html>
